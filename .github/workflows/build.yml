name: Build Rust Core for Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build phantom-core for Android
        working-directory: core/phantom-core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -o ./output build --release

      - name: Package phantom_pty as a fake .so (Android exec workaround)
        working-directory: core/phantom-core
        run: cp target/aarch64-linux-android/release/phantom_pty output/arm64-v8a/libphantom_pty.so

      - name: Upload native libraries artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantomaos-native-arm64-v8a
          path: core/phantom-core/output/arm64-v8a/
